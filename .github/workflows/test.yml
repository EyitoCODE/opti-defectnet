name: Evaluation integrity
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install numpy pillow opencv-python-headless
      - run: python -m unittest discover -s tests -v
      - name: Smoke test training and held-out evaluation
        env:
          OMP_NUM_THREADS: '2'
          MKL_NUM_THREADS: '2'
        run: |
          python src/data_generator.py --samples-per-class 10 --seed 42
          python src/train.py --epochs 1 --batch-size 4
          python src/evaluate.py
